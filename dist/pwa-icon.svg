<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.1" />

  <!-- Shopping Trolley -->
  <g filter="url(#glow)">
    <!-- Cart Body -->
    <path d="M120 140 H160 L195 310 H360 L395 180 H175" fill="none" stroke="url(#cartGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Wire Mesh -->
    <path d="M215 220 H375" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
    <path d="M230 265 H350" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
    <path d="M260 185 V305" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
    <path d="M315 185 V295" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.8"/>

    <!-- Wheels -->
    <circle cx="220" cy="370" r="24" fill="#ffffff" />
    <circle cx="220" cy="370" r="10" fill="#059669" />
    <circle cx="340" cy="370" r="24" fill="#ffffff" />
    <circle cx="340" cy="370" r="10" fill="#059669" />

    <!-- Sparkle / Smart Badge -->
    <g transform="translate(320, 100)">
      <circle cx="40" cy="40" r="38" fill="#f59e0b" stroke="#ffffff" stroke-width="6"/>
      <path d="M40 22 L45 34 L58 35 L48 44 L51 57 L40 50 L29 57 L32 44 L22 35 L35 34 Z" fill="#ffffff" />
    </g>
  </g>
</svg>

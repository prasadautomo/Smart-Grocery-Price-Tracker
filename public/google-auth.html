<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Google Accounts</title>
  <link rel="icon" href="https://www.google.com/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #202124;
      color: #e8eaed;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 36px 20px;
      user-select: none;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .header-brand svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .header-brand span {
      font-size: 15px;
      font-weight: 500;
      color: #e8eaed;
      letter-spacing: 0.1px;
    }

    .title-section {
      margin-bottom: 24px;
    }

    .main-title {
      font-size: 28px;
      font-weight: 400;
      color: #e8eaed;
      line-height: 1.25;
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }

    .sub-title {
      font-size: 15px;
      color: #9aa0a6;
      font-weight: 400;
      line-height: 1.4;
    }

    .sub-title .app-name {
      color: #8ab4f8;
      font-weight: 500;
    }

    .account-list {
      display: flex;
      flex-direction: column;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .account-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 14px;
      cursor: pointer;
      border-bottom: 1px solid #3c4043;
      transition: background-color 0.15s ease;
      position: relative;
    }

    .account-item:last-child {
      border-bottom: none;
    }

    .account-item:hover {
      background-color: #303134;
    }

    .account-item:active {
      background-color: #3c4043;
    }

    .avatar-wrapper {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 500;
      color: #ffffff;
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar-green {
      background-color: #0f9d58;
    }

    .avatar-blue {
      background-color: #1a73e8;
    }

    .avatar-amber {
      background-color: #f29900;
    }

    .avatar-purple {
      background-color: #8e24aa;
    }

    .account-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .account-name {
      font-size: 15px;
      font-weight: 500;
      color: #e8eaed;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-email {
      font-size: 13px;
      color: #9aa0a6;
      line-height: 1.3;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-primary {
      font-size: 11px;
      background: rgba(66, 133, 244, 0.2);
      color: #8ab4f8;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
      margin-left: auto;
    }

    .use-another-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 14px;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.15s ease;
      color: #e8eaed;
    }

    .use-another-item:hover {
      background-color: #303134;
    }

    .use-another-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9aa0a6;
      flex-shrink: 0;
    }

    .use-another-icon svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .use-another-text {
      font-size: 15px;
      font-weight: 500;
      color: #e8eaed;
    }

    #customAccountView {
      display: none;
      flex-direction: column;
      gap: 16px;
      margin-top: 10px;
    }

    .custom-input-box {
      width: 100%;
      background: transparent;
      border: 1px solid #5f6368;
      border-radius: 4px;
      padding: 14px 16px;
      color: #e8eaed;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .custom-input-box:focus {
      border-color: #8ab4f8;
      border-width: 2px;
      padding: 13px 15px;
    }

    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }

    .btn-text {
      background: transparent;
      border: none;
      color: #8ab4f8;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary {
      background-color: #8ab4f8;
      color: #202124;
      border: none;
      border-radius: 4px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid #3c4043;
      font-size: 12px;
      color: #9aa0a6;
    }

    .footer-links {
      display: flex;
      gap: 24px;
    }

    .footer-links a {
      color: #9aa0a6;
      text-decoration: none;
    }

    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(32, 33, 36, 0.85);
      backdrop-filter: blur(4px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(138, 180, 248, 0.2);
      border-top-color: #8ab4f8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div style="font-size: 14px; color: #e8eaed;" id="loadingText">Connecting to Google...</div>
  </div>

  <div class="main-container">
    <!-- Top Google Brand -->
    <div class="header-brand">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Google</span>
    </div>

    <!-- Title -->
    <div class="title-section">
      <h1 class="main-title">Choose an account</h1>
      <p class="sub-title">to continue to <span class="app-name">KeranjangPintar PRO</span></p>
    </div>

    <!-- Account Chooser View -->
    <div id="accountChooserView">
      <div class="account-list">
        <!-- Account 1: Gavin Utomo (Pemilik Utama) -->
        <div class="account-item" onclick="selectAccount('Gavin Utomo', 'gavinutomo4@gmail.com', 'G', 'avatar-blue')">
          <div class="avatar-wrapper avatar-blue">
            <span>G</span>
          </div>
          <div class="account-info">
            <span class="account-name">Gavin Utomo</span>
            <span class="account-email">gavinutomo4@gmail.com</span>
          </div>
          <span class="badge-primary">Utama</span>
        </div>

        <!-- Account 2: Rian Pratama (Anak Kos) -->
        <div class="account-item" onclick="selectAccount('Rian Pratama', 'rian.pratama@gmail.com', 'R', 'avatar-green')">
          <div class="avatar-wrapper avatar-green">
            <span>R</span>
          </div>
          <div class="account-info">
            <span class="account-name">Rian Pratama</span>
            <span class="account-email">rian.pratama@gmail.com</span>
          </div>
        </div>

        <!-- Account 3: Siti Rahma (Pengelola Anggaran) -->
        <div class="account-item" onclick="selectAccount('Siti Rahma', 'siti.rahma@gmail.com', 'S', 'avatar-purple')">
          <div class="avatar-wrapper avatar-purple">
            <span>S</span>
          </div>
          <div class="account-info">
            <span class="account-name">Siti Rahma</span>
            <span class="account-email">siti.rahma@gmail.com</span>
          </div>
        </div>
      </div>

      <!-- Use another account -->
      <div class="use-another-item" onclick="showCustomInput()">
        <div class="use-another-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
          </svg>
        </div>
        <span class="use-another-text">Use another account</span>
      </div>
    </div>

    <!-- Custom Account Input View -->
    <div id="customAccountView">
      <p style="font-size: 14px; color: #9aa0a6; margin-bottom: 4px;">Enter your Google email address</p>
      <input type="email" id="inputCustomEmail" class="custom-input-box" placeholder="Email or phone" autofocus>
      <div class="btn-row">
        <button type="button" class="btn-text" onclick="showChooser()">Back</button>
        <button type="button" class="btn-primary" onclick="submitCustomEmail()">Next</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div>
      <span>English (United States)</span>
    </div>
    <div class="footer-links">
      <a href="https://support.google.com/accounts" target="_blank">Help</a>
      <a href="https://policies.google.com/privacy" target="_blank">Privacy</a>
      <a href="https://policies.google.com/terms" target="_blank">Terms</a>
    </div>
  </div>

  <script>
    function selectAccount(name, email, avatarSymbol, avatarClass) {
      const overlay = document.getElementById('loadingOverlay');
      const loadingText = document.getElementById('loadingText');
      if (overlay) overlay.style.display = 'flex';
      if (loadingText) loadingText.textContent = 'Menghubungkan sebagai ' + name + '...';

      setTimeout(() => {
        const payload = {
          type: 'GOOGLE_SIGNIN_SUCCESS',
          account: {
            id: 'google_user_' + email.replace(/[^a-z0-9]/gi, '_'),
            name: name,
            email: email,
            avatarUrl: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(name) + '&background=10b981&color=fff',
            provider: 'google'
          }
        };

        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, '*');
          setTimeout(() => {
            window.close();
          }, 350);
        } else {
          try {
            localStorage.setItem('pending_google_login', JSON.stringify(payload.account));
            localStorage.setItem('smart_grocery_auth_user', JSON.stringify(payload.account));
            window.location.href = '/';
          } catch(e) {
            window.close();
          }
        }
      }, 500);
    }

    function showCustomInput() {
      document.getElementById('accountChooserView').style.display = 'none';
      document.getElementById('customAccountView').style.display = 'flex';
      const input = document.getElementById('inputCustomEmail');
      if (input) input.focus();
    }

    function showChooser() {
      document.getElementById('customAccountView').style.display = 'none';
      document.getElementById('accountChooserView').style.display = 'block';
    }

    function submitCustomEmail() {
      const input = document.getElementById('inputCustomEmail');
      const email = input ? input.value.trim() : '';
      if (!email || !email.includes('@')) {
        alert('Enter a valid email address');
        if (input) input.focus();
        return;
      }

      const username = email.split('@')[0];
      const name = username.charAt(0).toUpperCase() + username.slice(1);
      const symbol = (username[0] || 'G').toUpperCase();

      selectAccount(name, email, symbol, 'avatar-blue');
    }

    document.getElementById('inputCustomEmail')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        submitCustomEmail();
      }
    });
  </script>
</body>
</html>
